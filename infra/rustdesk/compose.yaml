services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: crumbyte-rustdesk-hbbs
    command: hbbs -r ${RUSTDESK_HOST}:21117
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped
  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: crumbyte-rustdesk-hbbr
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
