name: Website Hub

on:
  pull_request:
    paths:
      - 'hub/**'
      - '.github/workflows/hub.yml'
      - '.vercelignore'
      - 'vercel.json'
      - 'scripts/check-seo.py'
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - '.github/workflows/hub.yml'
      - '.vercelignore'
      - 'vercel.json'
      - 'scripts/check-seo.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    # A throwaway server that exists only for this job. Its password is not a secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Marketing site regression checks
        working-directory: .
        run: |
          python3 scripts/check-seo.py
          node --test tests/contact.test.mjs
      - name: Certify release inputs
        run: node scripts/certify-release.mjs
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - name: Create a non-superuser owner
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" -c "create role hub_owner login createrole password 'ci-owner'" -c "create database hub owner hub_owner" -c "create database hub_restore owner hub_owner"
      - name: PostgreSQL integration
        run: |
          node scripts/pg-integration.mjs
          node scripts/pg-security.mjs
          node scripts/pg-frontend.mjs
          node scripts/pg-recovery.mjs
        env:
          HUB_PG_OWNER_URL: postgres://hub_owner:ci-owner@localhost:5432/hub
      - name: Verify official serverless build
        run: |
          npm install --prefix "$RUNNER_TEMP/hub-builder" --no-audit --no-fund @vercel/node@29.0.1 @vercel/build-utils@15.2.1
          HUB_BUILDER_TOOLS_DIR="$RUNNER_TEMP/hub-builder" node scripts/verify-serverless-build.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
